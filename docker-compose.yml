
version: "3.8"

services:
  stackedit:
    image: ${STACKEDIT_IMAGE:-qmcgaw/stackedit}
    container_name: ${STACKEDIT_CONTAINER_NAME:-stackedit}
    restart: unless-stopped
    ports:
      - "${STACKEDIT_PORT:-3030}:8000"
    volumes:
      - stackedit_data:/data
    environment:
      - LISTENING_PORT=8000
      - ROOT_URL=${STACKEDIT_ROOT_URL:-/}
      - USER_BUCKET_NAME=${STACKEDIT_USER_BUCKET_NAME:-stackedit-users}
      # OAuth: bitte in .env setzen
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    networks:
      - ${STACKEDIT_NETWORK:-highfishNetwork}

volumes:
  stackedit_data:
    driver: local

networks:
  ${STACKEDIT_NETWORK:-highfishNetwork}:
    external: true
