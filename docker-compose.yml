
version: "3.8"

services:
  stackedit:
    image: ${STACKEDIT_IMAGE:-benweet/stackedit:latest}
    container_name: ${STACKEDIT_CONTAINER_NAME:-stackedit}
    restart: unless-stopped
    ports:
      - "${STACKEDIT_PORT:-3030}:8080"
    volumes:
      - stackedit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - highfishNetwork

volumes:
  stackedit_data:
    driver: local

networks:
  highfishNetwork:
    external: true
